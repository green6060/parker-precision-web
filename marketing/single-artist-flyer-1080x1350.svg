<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#131a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5ea6"/>
      <stop offset="100%" stop-color="#ff8f5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Header -->
  <g transform="translate(80,120)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Websites that book appointments</text>
    <text x="0" y="56" font-family="Inter, Arial, sans-serif" font-size="24" fill="#cfd7df">Built for tattoo artists • Convert visitors into clients</text>
  </g>

  <!-- Accent underline -->
  <rect x="80" y="200" width="420" height="6" rx="3" fill="url(#accent)"/>

  <!-- Packages -->
  <g transform="translate(80,260)" font-family="Inter, Arial, sans-serif">
    <!-- Essentials Card -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="440" height="430" rx="18" fill="#151c25" stroke="#243140" stroke-width="1"/>
      <text x="28" y="54" font-size="28" font-weight="700" fill="#ffffff">Essentials</text>
      <text x="28" y="96" font-size="20" fill="#8ea0b3">Get online in 1–2 weeks</text>
      <text x="28" y="144" font-size="18" fill="#e8edf3">• Home page that converts visitors</text>
      <text x="28" y="174" font-size="18" fill="#e8edf3">• Portfolio showcase of your work</text>
      <text x="28" y="204" font-size="18" fill="#e8edf3">• Calendly/booking integration</text>
      <text x="28" y="234" font-size="18" fill="#e8edf3">• Aftercare + FAQ pages</text>
      <text x="28" y="264" font-size="18" fill="#e8edf3">• Mobile-optimized + fast loading</text>
      <rect x="28" y="304" width="180" height="36" rx="8" fill="#1d2732"/>
      <text x="38" y="329" font-size="18" fill="#cfd7df">Setup $1,200–$1,800</text>
      <rect x="220" y="304" width="150" height="36" rx="8" fill="#1d2732"/>
      <text x="230" y="329" font-size="18" fill="#cfd7df">$79–$99/mo</text>
    </g>

    <!-- Pro Card -->
    <g transform="translate(480,0)" filter="url(#shadow)">
      <rect x="0" y="0" width="440" height="430" rx="18" fill="#151c25" stroke="#243140" stroke-width="1"/>
      <rect x="0" y="0" width="440" height="6" fill="url(#accent)"/>
      <text x="28" y="54" font-size="28" font-weight="800" fill="#ffffff">Pro</text>
      <text x="28" y="96" font-size="20" fill="#8ea0b3">Everything in Essentials plus:</text>
      <text x="28" y="144" font-size="18" fill="#e8edf3">• Advanced booking with deposits</text>
      <text x="28" y="174" font-size="18" fill="#e8edf3">• Google Reviews integration</text>
      <text x="28" y="204" font-size="18" fill="#e8edf3">• Directions + studio info page</text>
      <text x="28" y="234" font-size="18" fill="#e8edf3">• Style-specific portfolio pages</text>
      <text x="28" y="264" font-size="18" fill="#e8edf3">• Automated appointment reminders</text>
      <rect x="28" y="304" width="200" height="36" rx="8" fill="#1d2732"/>
      <text x="38" y="329" font-size="18" fill="#cfd7df">Setup $2,500–$4,000</text>
      <rect x="240" y="304" width="160" height="36" rx="8" fill="#1d2732"/>
      <text x="250" y="329" font-size="18" fill="#cfd7df">$149–$249/mo</text>
    </g>

    <!-- Premium Card -->
    <g transform="translate(0,470)" filter="url(#shadow)">
      <rect x="0" y="0" width="920" height="420" rx="18" fill="#151c25" stroke="#243140" stroke-width="1"/>
      <text x="28" y="54" font-size="28" font-weight="700" fill="#ffffff">Premium</text>
      <text x="28" y="96" font-size="20" fill="#8ea0b3">For artists ready to dominate</text>
      <text x="28" y="144" font-size="18" fill="#e8edf3">• Everything in Pro</text>
      <text x="28" y="174" font-size="18" fill="#e8edf3">• Multi-location/guest spot pages</text>
      <text x="28" y="204" font-size="18" fill="#e8edf3">• Flash sale + waitlist system</text>
      <text x="28" y="234" font-size="18" fill="#e8edf3">• Online deposits + gift cards</text>
      <text x="28" y="264" font-size="18" fill="#e8edf3">• Monthly performance reports</text>
      <rect x="28" y="304" width="220" height="36" rx="8" fill="#1d2732"/>
      <text x="38" y="329" font-size="18" fill="#cfd7df">Setup $4,000–$6,500</text>
      <rect x="260" y="304" width="180" height="36" rx="8" fill="#1d2732"/>
      <text x="270" y="329" font-size="18" fill="#cfd7df">$299–$449/mo</text>
    </g>
  </g>

  <!-- CTA strip -->
  <g transform="translate(0,1190)">
    <rect x="80" y="0" width="920" height="120" rx="16" fill="#0f1520" stroke="#243140"/>
    <rect x="80" y="0" width="920" height="8" fill="url(#accent)"/>
    <text x="120" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Book more clients • Launch in 14 days</text>
    <text x="120" y="94" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cfd7df">@yourhandle  •  yoursite.com  •  hello@yoursite.com</text>
  </g>

  <!-- Watermark -->
  <text x="80" y="1140" font-family="Inter, Arial, sans-serif" font-size="16" fill="#8ea0b3">Special pricing for first 3 artists • Referral rewards available</text>
</svg>


