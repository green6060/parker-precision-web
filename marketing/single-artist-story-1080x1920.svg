<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#131a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5ea6"/>
      <stop offset="100%" stop-color="#ff8f5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Header -->
  <g transform="translate(80,140)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Book more clients</text>
    <text x="0" y="56" font-family="Inter, Arial, sans-serif" font-size="26" fill="#cfd7df">Professional websites for tattoo artists</text>
  </g>
  <rect x="80" y="210" width="480" height="6" rx="3" fill="url(#accent)"/>

  <!-- Stacked Cards -->
  <g transform="translate(80,270)" font-family="Inter, Arial, sans-serif">
    <!-- Essentials -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="920" height="420" rx="20" fill="#151c25" stroke="#243140"/>
      <text x="32" y="60" font-size="30" font-weight="700" fill="#ffffff">Essentials</text>
      <text x="32" y="100" font-size="22" fill="#8ea0b3">Get online in 1–2 weeks</text>
      <text x="32" y="150" font-size="20" fill="#e8edf3">• Home page that funnels leads</text>
      <text x="32" y="182" font-size="20" fill="#e8edf3">• Portfolio of your best work</text>
      <text x="32" y="214" font-size="20" fill="#e8edf3">• Embedded Calendly booking</text>
      <text x="32" y="246" font-size="20" fill="#e8edf3">• Aftercare + FAQ pages</text>
      <text x="32" y="278" font-size="20" fill="#e8edf3">• Mobile-optimized design</text>
      <rect x="32" y="320" width="230" height="40" rx="10" fill="#1d2732"/>
      <text x="44" y="347" font-size="20" fill="#cfd7df">Setup $1,200–$1,800  •  $79–$99/mo</text>
    </g>

    <!-- Pro -->
    <g transform="translate(0,460)" filter="url(#shadow)">
      <rect x="0" y="0" width="920" height="460" rx="20" fill="#151c25" stroke="#243140"/>
      <rect x="0" y="0" width="920" height="8" fill="url(#accent)"/>
      <text x="32" y="60" font-size="30" font-weight="800" fill="#ffffff">Pro</text>
      <text x="32" y="100" font-size="22" fill="#8ea0b3">Everything in Essentials plus:</text>
      <text x="32" y="150" font-size="20" fill="#e8edf3">• Advanced scheduling + deposits</text>
      <text x="32" y="182" font-size="20" fill="#e8edf3">• Google Reviews integration</text>
      <text x="32" y="214" font-size="20" fill="#e8edf3">• Directions + studio info</text>
      <text x="32" y="246" font-size="20" fill="#e8edf3">• Style-specific galleries</text>
      <text x="32" y="278" font-size="20" fill="#e8edf3">• Automated reminders</text>
      <rect x="32" y="320" width="270" height="40" rx="10" fill="#1d2732"/>
      <text x="44" y="347" font-size="20" fill="#cfd7df">Setup $2,500–$4,000  •  $149–$249/mo</text>
    </g>

    <!-- Premium -->
    <g transform="translate(0,960)" filter="url(#shadow)">
      <rect x="0" y="0" width="920" height="460" rx="20" fill="#151c25" stroke="#243140"/>
      <text x="32" y="60" font-size="30" font-weight="700" fill="#ffffff">Premium</text>
      <text x="32" y="100" font-size="22" fill="#8ea0b3">For established artists</text>
      <text x="32" y="150" font-size="20" fill="#e8edf3">• Everything in Pro</text>
      <text x="32" y="182" font-size="20" fill="#e8edf3">• Multi-location pages</text>
      <text x="32" y="214" font-size="20" fill="#e8edf3">• Flash sale system</text>
      <text x="32" y="246" font-size="20" fill="#e8edf3">• Online payments + deposits</text>
      <text x="32" y="278" font-size="20" fill="#e8edf3">• Performance analytics</text>
      <rect x="32" y="320" width="260" height="40" rx="10" fill="#1d2732"/>
      <text x="44" y="347" font-size="20" fill="#cfd7df">Setup $4,000–$6,500  •  $299–$449/mo</text>
    </g>
  </g>

  <!-- CTA Footer -->
  <g transform="translate(0,1700)">
    <rect x="80" y="0" width="920" height="160" rx="18" fill="#0f1520" stroke="#243140"/>
    <rect x="80" y="0" width="920" height="10" fill="url(#accent)"/>
    <text x="120" y="66" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Start booking more clients today</text>
    <text x="120" y="112" font-family="Inter, Arial, sans-serif" font-size="24" fill="#cfd7df">@yourhandle  •  yoursite.com  •  hello@yoursite.com</text>
  </g>

  <!-- Watermark -->
  <text x="80" y="1660" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8ea0b3">Limited-time pricing • First 3 artists only</text>
</svg>


